name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Verify package contents
        run: pnpm -r --fail-if-no-match --filter @zakobot/shared --filter @zakobot/database --filter @zakobot/core --filter @zakobot/panel --filter ./packages/cli pack --dry-run

      - name: Publish packages
        run: pnpm -r --fail-if-no-match --filter @zakobot/shared --filter @zakobot/database --filter @zakobot/core --filter @zakobot/panel --filter ./packages/cli publish --access public --no-git-checks --report-summary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
